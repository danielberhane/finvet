# Every published port binds to loopback. `"5432:5432"` publishes on 0.0.0.0,
# which put a Postgres with a development default password, an API with no
# authentication, and an unauthenticated Ollama on whatever network the host
# happened to be joined to -- a coffee-shop Wi-Fi included. This stack is a
# local demonstration and nothing in it expects a caller from another machine.
#
# Container-to-container traffic is unaffected: services reach each other over
# the compose network by name (api -> postgres:5432, ui -> api:8000), which
# does not go through a published port.
#
# To expose the stack deliberately -- a LAN demo, a remote workstation --
# set FINVET_BIND_ADDR=0.0.0.0, and change POSTGRES_PASSWORD before you do.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finvet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finvet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finvet_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-finvet}
    ports:
      - "${FINVET_BIND_ADDR:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finvet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI backend. Reads all keys from .env; the in-network service addresses
  # below override the localhost defaults (no user action needed in Docker mode).
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    container_name: finvet-api
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      SEC_EDGAR_MCP_URL: http://sec-edgar-mcp:9870
      LLAMA_GUARD_URL: http://ollama:11434
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "${FINVET_BIND_ADDR:-127.0.0.1}:8000:8000"
    restart: unless-stopped

  # Streamlit UI. Talks to the API over the compose network.
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ui
    container_name: finvet-ui
    env_file: .env
    environment:
      FINVET_API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "${FINVET_BIND_ADDR:-127.0.0.1}:8501:8501"
    restart: unless-stopped

  # SEC EDGAR MCP server — self-contained (installs the published package at a
  # pinned version; no sibling checkout needed).
  # Start with:  docker compose --profile sec up -d
  sec-edgar-mcp:
    profiles: ["sec"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sec
    container_name: finvet-sec-edgar-mcp
    command: ["python", "-m", "sec_edgar_mcp.server", "--transport", "streamable-http", "--port", "9870"]
    environment:
      SEC_EDGAR_USER_AGENT: ${SEC_EDGAR_USER_AGENT:-FinVet (your@email.com)}
    ports:
      - "${FINVET_BIND_ADDR:-127.0.0.1}:9870:9870"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',9870),2); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Local model server. Always on: it serves the embedding model that the RAG
  # corpus and claim memory both depend on, so there is no API key anywhere in
  # the embedding path. Pull the model once the stack is up:
  #   docker exec finvet-ollama ollama pull nomic-embed-text
  # It also hosts the optional Llama Guard semantic guardrail, which stays off
  # by default (the regex guard runs standalone). To enable that as well:
  #   ENABLE_LLAMA_GUARD=true and docker exec finvet-ollama ollama pull llama-guard3:8b
  ollama:
    image: ollama/ollama
    container_name: finvet-ollama
    ports:
      - "${FINVET_BIND_ADDR:-127.0.0.1}:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
