[project]
name = "finvet"
version = "2.0.9"
description = "Financial claim verification system"
# CI tests 3.11, 3.12 and 3.13. An unbounded floor advertises support for
# versions nothing has ever run.
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=1.1.0",   # llm/factory.py — the OpenAI-*compatible*
                                 # client used for DeepSeek/Ollama/vLLM/LiteLLM
    "langchain-core>=1.2.8",     # imported directly in 12 modules; it
                                 # arrived transitively before, so a
                                 # langchain bump could have removed it
    "tiktoken>=0.12.0",          # rag/parser.py — chunk token counting
    # "langchain-anthropic>=0.2.0",
    # "anthropic>=0.39.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pgvector>=0.4.2",
    "beautifulsoup4>=4.14.3",
    # UI (ui/app.py)
    "streamlit>=1.40.0",
    "pandas>=2.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
# Claim memory only. It ships disabled (RELEASE_A_DECISIONS.md, D8), so a
# default install does not need these -- and main.py imports PostgresStore
# lazily, inside the feature gate, so the API boots without them.
#   uv sync --extra memory
memory = [
    "langgraph-checkpoint-postgres>=3.0.4",
    "psycopg[binary]>=3.1.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finvet"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires live external services (Postgres, API, MCP). Opt in with -m integration",
]
addopts = "-m 'not integration'"

[tool.ruff.lint.per-file-ignores]
"src/finvet/main.py" = ["E402"]  # load_dotenv() must run before finvet imports read the env
