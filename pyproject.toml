[project]
name = "finvet"
version = "2.0.9"
description = "Agentic financial claim verification with a deterministic verdict override"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Daniel Berhane Araya" }]
keywords = ["financial-claims", "fact-checking", "sec-edgar", "xbrl", "langgraph", "agents", "evaluation"]
# CI tests 3.11, 3.12 and 3.13. An unbounded floor advertises support for
# versions nothing has ever run.
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.0.0",           # agents/base.py — create_agent lives here from 1.0
    "langgraph>=0.2.0",
    "langchain-openai>=1.1.0",   # llm/factory.py — the OpenAI-*compatible*
                                 # client used for DeepSeek/Ollama/vLLM/LiteLLM
    "langchain-core>=1.2.8",     # imported directly in 12 modules; it
                                 # arrived transitively before, so a
                                 # langchain bump could have removed it
    "tiktoken>=0.12.0",          # rag/parser.py — chunk token counting
    # "langchain-anthropic>=0.2.0",
    # "anthropic>=0.39.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pgvector>=0.4.2",
    "beautifulsoup4>=4.14.3",
    # UI (ui/app.py)
    "streamlit>=1.40.0",
    "pandas>=2.0.0",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/danielberhane/finvet"
Repository = "https://github.com/danielberhane/finvet"
Issues = "https://github.com/danielberhane/finvet/issues"

[project.optional-dependencies]
# Claim memory only. It ships disabled (RELEASE_A_DECISIONS.md, D8), so a
# default install does not need these -- and main.py imports PostgresStore
# lazily, inside the feature gate, so the API boots without them.
#   uv sync --extra memory
memory = [
    "langgraph-checkpoint-postgres>=3.0.4",
    "psycopg[binary]>=3.1.0",
]
# Trajectory scoring only (Layer 2). DeepEval's ToolCorrectnessMetric is a
# deterministic set comparison -- no judge, no API key -- and it is imported
# from exactly one place, `eval/measures/trajectory.py`, which falls back to the
# same comparison inline when it is absent. Nothing in the pipeline imports it.
#   uv sync --extra evaluation
evaluation = [
    "deepeval>=4.0.0",
]
# The dev tools are a dependency group, not an extra -- see [dependency-groups]
# below. They were declared in both places with identical pins, which is two
# sources of truth for one list and one edit away from disagreeing. `uv sync`
# installs the group by default, which is what CI relies on.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finvet"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires live external services (Postgres, API, MCP). Opt in with -m integration",
]
addopts = "-m 'not integration'"

[tool.ruff.lint]
# Pinned, not inherited. With nothing selected here the project ran on ruff's
# implicit defaults, so the 0.14 -> 0.16 bump changed what "lint clean" means
# and CI went from zero findings to 1,173 without a line of source changing.
# This is the set the codebase was written against: pyflakes plus the
# pycodestyle errors that catch real mistakes. Widening it is a deliberate
# decision with a backlog attached, not something a dependency update makes.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/finvet/main.py" = ["E402"]  # load_dotenv() must run before finvet imports read the env
