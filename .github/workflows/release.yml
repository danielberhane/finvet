name: release

# Publishes versioned container images to GHCR on a semver tag (e.g. v2.1.0).
# This is distribution (pullable images), NOT deploy-to-live: FinVet exposes an
# unauthenticated API wired to a paid LLM and must not be auto-hosted publicly.

on:
  push:
    tags: ["v*.*.*"]

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: finvet-api
            file: docker/Dockerfile
            target: api
          - image: finvet-ui
            file: docker/Dockerfile
            target: ui
          - image: finvet-sec-edgar-mcp
            file: docker/Dockerfile.sec
            target: ""
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          # amd64 only: emulated arm64 builds of this LangChain-heavy image are
          # slow and flaky on GitHub runners. Apple Silicon runs it under emulation.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
