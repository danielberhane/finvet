name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  # Resolve the same Python the lock was built against; uv downloads it if absent.
  UV_PYTHON: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.3"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.3"
          enable-cache: true
      - run: uv sync --frozen
      # Integration tests are excluded by pyproject addopts; eval-dependent tests
      # skip without FINVET_EVAL_DATA_DIR, so no secrets are needed here.
      - run: uv run pytest tests/unit -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ui
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build sec-edgar-mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sec
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
