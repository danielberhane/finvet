name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  # The version .python-version pins for local dev and the Docker images.
  # uv downloads it if absent. The test job overrides this per matrix entry;
  # UV_PYTHON takes precedence over .python-version, so the matrix is real.
  UV_PYTHON: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.3"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      # Focused type checking on the trust-boundary modules only. A global
      # mypy pass is not a release gate; these three decide whether a number
      # may reach a verdict and whether a stored record verifies.
      - run: |
          uv run mypy \
            src/finvet/models/evidence.py \
            src/finvet/api/execution.py \
            src/finvet/audit/integrity.py
      # Documentation drift guard: every src/ path named in docs must exist.
      # ARCHITECTURE.md pointed at a memory/service.py that never existed.
      - name: Docs reference real files
        run: |
          missing=0
          for p in $(grep -ohrE 'src/finvet/[A-Za-z0-9_/]+\.py' docs/*.md README.md | sort -u); do
            [ -f "$p" ] || { echo "docs reference a missing file: $p"; missing=1; }
          done
          exit $missing

  test:
    runs-on: ubuntu-latest
    # pyproject declares requires-python >=3.11; test every version it claims.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.3"
          enable-cache: true
      - run: uv sync --frozen
      # Integration tests are excluded by pyproject addopts; eval-dependent tests
      # skip without FINVET_EVAL_DATA_DIR, so no secrets are needed here.
      # Coverage floor. Measured 72% on 2026-08-25; the gate sits just below so
      # a regression fails while the suite keeps room to grow. Task 11 Step 5
      # targets 75% overall and 85% on verify.py, review.py, audit/database.py,
      # base.py, rag/service.py and output_guardrails.py -- reachable once
      # Tasks 6, 8 and 9 add their tests, and raised at the Task 12 gate.
      - run: uv run pytest tests/unit -q --cov=src/finvet --cov-fail-under=70

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ui
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build sec-edgar-mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sec
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
