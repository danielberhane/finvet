name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  # The version .python-version pins for local dev and the Docker images.
  # uv downloads it if absent. The test job overrides this per matrix entry;
  # UV_PYTHON takes precedence over .python-version, so the matrix is real.
  UV_PYTHON: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.3"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    # pyproject declares requires-python >=3.11; test every version it claims.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.3"
          enable-cache: true
      - run: uv sync --frozen
      # Integration tests are excluded by pyproject addopts; eval-dependent tests
      # skip without FINVET_EVAL_DATA_DIR, so no secrets are needed here.
      - run: uv run pytest tests/unit -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ui
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build sec-edgar-mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sec
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
