<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3B82F6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="780" fill="#F8FAFC" rx="12"/>

  <!-- Title -->
  <rect x="0" y="0" width="1000" height="56" fill="url(#headerGrad)" rx="12"/>
  <rect x="0" y="40" width="1000" height="16" fill="url(#headerGrad)"/>
  <text x="500" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">ReAct Agent Execution — 3-Phase Verdict Extraction</text>

  <!-- ============ PHASE 1: Context Building ============ -->
  <text x="50" y="92" fill="#94A3B8" font-size="11" font-weight="600" letter-spacing="1">PHASE 0 — CONTEXT BUILDING</text>

  <rect x="50" y="104" width="900" height="80" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="104" width="4" height="80" rx="2" fill="#64748B"/>

  <text x="74" y="130" fill="#1E293B" font-size="12" font-weight="700">_build_context()</text>

  <!-- Context items -->
  <g transform="translate(74, 140)">
    <rect x="0" y="0" width="80" height="22" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="40" y="15" text-anchor="middle" fill="#475569" font-size="9" font-weight="500">Claim Text</text>
  </g>
  <g transform="translate(162, 140)">
    <rect x="0" y="0" width="96" height="22" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="48" y="15" text-anchor="middle" fill="#475569" font-size="9" font-weight="500">Parsed Fields</text>
  </g>
  <g transform="translate(266, 140)">
    <rect x="0" y="0" width="112" height="22" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="56" y="15" text-anchor="middle" fill="#475569" font-size="9" font-weight="500">Canonical Period</text>
  </g>
  <g transform="translate(386, 140)">
    <rect x="0" y="0" width="100" height="22" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="50" y="15" text-anchor="middle" fill="#475569" font-size="9" font-weight="500">Company Info</text>
  </g>
  <g transform="translate(494, 140)">
    <rect x="0" y="0" width="110" height="22" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="55" y="15" text-anchor="middle" fill="#92400E" font-size="9" font-weight="500">Memory Context</text>
  </g>
  <g transform="translate(612, 140)">
    <rect x="0" y="0" width="130" height="22" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="65" y="15" text-anchor="middle" fill="#475569" font-size="9" font-weight="500">System Prompt (.txt)</text>
  </g>

  <!-- Arrow down -->
  <line x1="500" y1="184" x2="500" y2="210" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ PHASE 1: ReAct Loop ============ -->
  <text x="50" y="228" fill="#10B981" font-size="11" font-weight="600" letter-spacing="1">PHASE 1 — ReAct LOOP (max 5 iterations)</text>

  <!-- Loop box -->
  <rect x="50" y="240" width="900" height="260" rx="12" fill="white" stroke="#A7F3D0" stroke-width="2" filter="url(#shadow)" stroke-dasharray="6,3"/>
  <rect x="50" y="240" width="4" height="260" rx="2" fill="#10B981"/>

  <!-- Step: Reason -->
  <rect x="90" y="264" width="200" height="60" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="190" y="288" text-anchor="middle" fill="#047857" font-size="13" font-weight="700">Reason</text>
  <text x="190" y="308" text-anchor="middle" fill="#047857" font-size="10">LLM analyzes evidence so far</text>

  <line x1="290" y1="294" x2="340" y2="294" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Decision diamond -->
  <polygon points="420,264 490,294 420,324 350,294" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="420" y="290" text-anchor="middle" fill="#92400E" font-size="10" font-weight="700">Tool</text>
  <text x="420" y="303" text-anchor="middle" fill="#92400E" font-size="10" font-weight="700">calls?</text>

  <!-- Yes branch: Act -->
  <line x1="490" y1="294" x2="530" y2="294" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="510" y="288" fill="#10B981" font-size="9" font-weight="600">YES</text>

  <rect x="532" y="264" width="200" height="60" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="632" y="288" text-anchor="middle" fill="#1E40AF" font-size="13" font-weight="700">Act</text>
  <text x="632" y="308" text-anchor="middle" fill="#1E40AF" font-size="10">Execute tools, truncate to 50K</text>

  <line x1="732" y1="294" x2="770" y2="294" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Observe -->
  <rect x="772" y="264" width="160" height="60" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="852" y="288" text-anchor="middle" fill="#6D28D9" font-size="13" font-weight="700">Observe</text>
  <text x="852" y="308" text-anchor="middle" fill="#6D28D9" font-size="10">Append ToolMessage</text>

  <!-- Loop back arrow -->
  <path d="M 852 324 L 852 356 L 190 356 L 190 324" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-dasharray="5,3"/>
  <text x="520" y="370" text-anchor="middle" fill="#10B981" font-size="9" font-weight="600">next iteration</text>

  <!-- No branch: Done reasoning -->
  <path d="M 420 324 L 420 390 L 170 390 L 170 420" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="398" y="360" fill="#EF4444" font-size="9" font-weight="600">NO (done)</text>

  <!-- Provenance capture note -->
  <rect x="560" y="340" width="330" height="52" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
  <text x="580" y="360" fill="#9A3412" font-size="10" font-weight="600">Provenance Capture</text>
  <text x="580" y="376" fill="#9A3412" font-size="9">If tool ∈ _provenance_tool_names: save full result</text>
  <text x="580" y="388" fill="#9A3412" font-size="9">(search_filing_text → RAG, corroborate_with_news → A2A)</text>

  <!-- Iteration counter -->
  <rect x="64" y="430" width="130" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="129" y="449" text-anchor="middle" fill="#475569" font-size="10">Capture reasoning</text>

  <!-- Arrow to Phase 2 -->
  <line x1="500" y1="500" x2="500" y2="530" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ PHASE 2: Verdict Extraction ============ -->
  <text x="50" y="548" fill="#3B82F6" font-size="11" font-weight="600" letter-spacing="1">PHASE 2 — VERDICT EXTRACTION (separate LLM call)</text>

  <rect x="50" y="560" width="900" height="70" rx="10" fill="white" stroke="#BFDBFE" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="560" width="4" height="70" rx="2" fill="#3B82F6"/>

  <text x="74" y="586" fill="#1E293B" font-size="12" font-weight="700">Verdict LLM</text>
  <text x="180" y="586" fill="#3B82F6" font-size="10">with_structured_output(VerdictOutput, method="json_mode")</text>

  <text x="74" y="610" fill="#64748B" font-size="10">Skips agent's final reasoning (prevent anchoring) → Returns: verdict, confidence, reasoning, retrieved_value</text>

  <!-- Output boxes -->
  <g transform="translate(640, 574)">
    <rect x="0" y="0" width="70" height="20" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="35" y="14" text-anchor="middle" fill="#047857" font-size="9" font-weight="600">SUPPORTS</text>
  </g>
  <g transform="translate(716, 574)">
    <rect x="0" y="0" width="66" height="20" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="33" y="14" text-anchor="middle" fill="#991B1B" font-size="9" font-weight="600">REFUTES</text>
  </g>
  <g transform="translate(788, 574)">
    <rect x="0" y="0" width="66" height="20" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="33" y="14" text-anchor="middle" fill="#92400E" font-size="9" font-weight="600">NEI</text>
  </g>
  <g transform="translate(860, 574)">
    <rect x="0" y="0" width="70" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="35" y="14" text-anchor="middle" fill="#475569" font-size="9" font-weight="500">0.0 – 1.0</text>
  </g>

  <!-- Arrow to Phase 3 -->
  <line x1="500" y1="630" x2="500" y2="656" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ PHASE 3: Python Override ============ -->
  <text x="50" y="674" fill="#8B5CF6" font-size="11" font-weight="600" letter-spacing="1">PHASE 3 — PYTHON VERDICT OVERRIDE (deterministic)</text>

  <rect x="50" y="686" width="900" height="78" rx="10" fill="white" stroke="#DDD6FE" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="686" width="4" height="78" rx="2" fill="#8B5CF6"/>

  <text x="74" y="712" fill="#1E293B" font-size="12" font-weight="700">Magnitude Comparison</text>
  <text x="260" y="712" fill="#8B5CF6" font-size="10">When both claimed_value and retrieved_value exist</text>

  <text x="74" y="734" fill="#64748B" font-size="10">diff = |claimed - retrieved| / max(|claimed|, |retrieved|) × 100</text>

  <!-- Tolerance badges -->
  <g transform="translate(520, 700)">
    <rect x="0" y="0" width="110" height="22" rx="4" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="55" y="15" text-anchor="middle" fill="#6D28D9" font-size="9" font-weight="500">SEC >$1B: ≤1%</text>
  </g>
  <g transform="translate(636, 700)">
    <rect x="0" y="0" width="110" height="22" rx="4" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="55" y="15" text-anchor="middle" fill="#6D28D9" font-size="9" font-weight="500">SEC ≤$1B: ≤2%</text>
  </g>
  <g transform="translate(752, 700)">
    <rect x="0" y="0" width="90" height="22" rx="4" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="45" y="15" text-anchor="middle" fill="#6D28D9" font-size="9" font-weight="500">Market: ≤5%</text>
  </g>
  <g transform="translate(848, 700)">
    <rect x="0" y="0" width="86" height="22" rx="4" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="43" y="15" text-anchor="middle" fill="#6D28D9" font-size="9" font-weight="500">News: ≤5%</text>
  </g>

  <text x="74" y="754" fill="#475569" font-size="10">Equality: diff ≤ tolerance → SUPPORTS (0.95), else REFUTES (0.92) · Directional: boolean compare → SUPPORTS/REFUTES</text>
</svg>