<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="One claim's journey through FinVet left to right: guards, parse, period, agent loop with its four sources, comparator, output guards, review, response; the two places a claim is declined; and the audit trail collecting every step" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <rect width="1200" height="640" rx="14" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">FinVet — one claim, start to finish</text>

  <!-- main strip -->
  <g stroke-width="1.5">
    <rect x="30" y="120" width="130" height="70" rx="8" fill="#FFF2CC" stroke="#D6B656"/>
    <rect x="185" y="120" width="130" height="70" rx="8" fill="#E1D5E7" stroke="#9673A6"/>
    <rect x="340" y="120" width="130" height="70" rx="8" fill="#ffffff" stroke="#4b5563"/>
    <rect x="495" y="120" width="160" height="70" rx="8" fill="#E1D5E7" stroke="#9673A6"/>
    <rect x="680" y="120" width="150" height="70" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <rect x="855" y="120" width="130" height="70" rx="8" fill="#FFF2CC" stroke="#D6B656"/>
    <rect x="1010" y="120" width="160" height="70" rx="8" fill="#ffffff" stroke="#4b5563"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="95" y="148">Input guards</text><text x="250" y="148">Parse</text><text x="405" y="148">Resolve period</text>
    <text x="575" y="148">Agent loop</text><text x="755" y="148">Compare</text><text x="920" y="148">Output guards</text><text x="1090" y="148">Response</text>
  </g>
  <g font-size="11" fill="#4b5563" text-anchor="middle">
    <text x="95" y="168">regex · Llama Guard</text><text x="250" y="168">model · 7 fields</text><text x="405" y="168">code · dates</text>
    <text x="575" y="168">model · tools · ≤ 8 steps</text><text x="755" y="168">code · fixed tolerance</text><text x="920" y="168">safety · triggers</text><text x="1090" y="168">verdict · figure · evidence</text>
  </g>
  <g font-size="10" fill="#6b7280" text-anchor="middle">
    <text x="95" y="183">step 1</text><text x="250" y="183">step 2</text><text x="405" y="183">step 3</text><text x="575" y="183">step 4</text><text x="755" y="183">step 5</text><text x="920" y="183">step 6</text><text x="1090" y="183">step 7</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)">
    <line x1="160" y1="155" x2="183" y2="155"/><line x1="315" y1="155" x2="338" y2="155"/><line x1="470" y1="155" x2="493" y2="155"/>
    <line x1="655" y1="155" x2="678" y2="155"/><line x1="830" y1="155" x2="853" y2="155"/><line x1="985" y1="155" x2="1008" y2="155"/>
  </g>
  <text x="667" y="112" font-size="11" fill="#6b7280" text-anchor="middle">figure + provenance</text>

  <!-- exits upward: declines and review -->
  <g stroke-width="1.5">
    <rect x="185" y="52" width="130" height="40" rx="8" fill="#F8CECC" stroke="#B85450"/>
    <rect x="680" y="52" width="150" height="40" rx="8" fill="#F8CECC" stroke="#B85450"/>
    <rect x="855" y="220" width="130" height="50" rx="8" fill="#D5E8D4" stroke="#82B366"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="250" y="70">Rejected</text><text x="755" y="70">Declined</text><text x="920" y="241">Human review</text>
  </g>
  <g font-size="10" fill="#4b5563" text-anchor="middle">
    <text x="250" y="84">not a claim · out of scope</text><text x="755" y="84">no trusted figure</text><text x="920" y="258">paused · resumes to step 7</text>
  </g>
  <g stroke="#B85450" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)">
    <line x1="250" y1="120" x2="250" y2="94"/><line x1="755" y1="120" x2="755" y2="94"/>
  </g>
  <path d="M920,190 V218" stroke="#82B366" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
  <path d="M985,245 H1090 V192" stroke="#82B366" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="1040" y="238" font-size="10" fill="#4b5563" text-anchor="middle">resume</text>
  <path d="M315,72 H560 V118" stroke="#B85450" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0"/>

  <!-- sources under the agent loop -->
  <g stroke="#4b5563" stroke-width="1.5" fill="#f9fafb">
    <rect x="330" y="320" width="150" height="60" rx="8"/><rect x="500" y="320" width="150" height="60" rx="8"/>
    <rect x="670" y="320" width="150" height="60" rx="8"/><rect x="840" y="320" width="150" height="60" rx="8"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="405" y="343">SEC EDGAR MCP</text><text x="575" y="343">Filing-text index</text><text x="745" y="343">Finnhub</text><text x="915" y="343">Tavily</text>
  </g>
  <g font-size="11" fill="#4b5563" text-anchor="middle">
    <text x="405" y="363">XBRL facts</text><text x="575" y="363">pgvector + full text</text><text x="745" y="363">quotes</text><text x="915" y="363">news</text>
  </g>
  <g stroke="#9673A6" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M540,190 V260 H405 V318"/><path d="M575,190 V318"/><path d="M610,190 V260 H745 V318"/><path d="M640,190 V300 H915 V318"/>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="middle"><text x="470" y="255">SEC · facts</text><text x="610" y="255" text-anchor="start">SEC · text</text><text x="680" y="255">market</text><text x="780" y="295">news</text></g>
  <path d="M840,350 H650" stroke="#5F6B7A" stroke-width="1.5" stroke-dasharray="2 4" fill="none" marker-end="url(#a)"/>
  <text x="745" y="400" font-size="11" fill="#5F6B7A" text-anchor="middle">news → SEC delegation · one way · cannot recurse</text>
  <text x="660" y="420" font-size="11" fill="#6b7280" text-anchor="middle">a trusted figure is an XBRL fact, a timed quote, or a penalty amount extracted by code</text>

  <!-- audit rail -->
  <rect x="30" y="500" width="1140" height="90" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <text x="600" y="526" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Audit trail · PostgreSQL</text>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="330" y="552">audit_events: one row per step and per tool call</text>
    <text x="870" y="552">audit_executions: one envelope per request, SHA-256 checksum re-verified on read</text>
    <text x="600" y="574">retrieved passages keep filing, period, section, query, scores and a content hash</text>
  </g>
  <g stroke="#6C8EBF" stroke-width="1.2" stroke-dasharray="2 4" fill="none" marker-end="url(#a)">
    <path d="M95,190 V498"/><path d="M250,190 V498"/><path d="M405,380 V498"/><path d="M575,380 V498"/><path d="M745,380 V498"/><path d="M915,380 V498"/><path d="M1090,190 V498"/>
  </g>
  <text x="1130" y="470" font-size="11" fill="#6C8EBF" text-anchor="end">every step is recorded</text>

  <!-- legend -->
  <g font-size="11" fill="#4b5563">
    <rect x="30" y="612" width="14" height="14" rx="3" fill="#E1D5E7" stroke="#9673A6"/><text x="50" y="623">model</text>
    <rect x="110" y="612" width="14" height="14" rx="3" fill="#ffffff" stroke="#4b5563"/><text x="130" y="623">code</text>
    <rect x="180" y="612" width="14" height="14" rx="3" fill="#FFF2CC" stroke="#D6B656"/><text x="200" y="623">guard</text>
    <rect x="260" y="612" width="14" height="14" rx="3" fill="#D5E8D4" stroke="#82B366"/><text x="280" y="623">human</text>
    <rect x="340" y="612" width="14" height="14" rx="3" fill="#F8CECC" stroke="#B85450"/><text x="360" y="623">declined</text>
    <rect x="430" y="612" width="14" height="14" rx="3" fill="#DAE8FC" stroke="#6C8EBF"/><text x="450" y="623">store</text>
  </g>
</svg>
