<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrA2A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title{font-size:30px;font-weight:800;fill:#0f172a}
      .sub{font-size:15px;fill:#64748b}
      .legk{font-size:13px;fill:#475569;font-weight:600}
      .leg{font-size:13px;fill:#475569}
      .nh{font-size:15px;font-weight:700}
      .ns{font-size:11.5px;fill:#475569}
      .badge{font-size:10.5px;font-weight:600;fill:#334155}
      .elbl{font-size:11.5px;fill:#475569;font-weight:600}
      .elblr{font-size:11.5px;fill:#ef4444;font-weight:600}
      .term{font-size:15px;font-weight:800;fill:#334155}
      .pt{font-size:13px;font-weight:800;fill:#0f172a}
      .pk{font-size:12px;font-weight:700;fill:#334155}
      .pv{font-size:11.5px;fill:#475569}
      .mono{font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;fill:#334155}
      .edge{stroke:#334155;stroke-width:2;fill:none}
      .cond{stroke:#334155;stroke-width:2;fill:none;stroke-dasharray:6 5}
      .chan{stroke:#94a3b8;stroke-width:1.6;fill:none;stroke-dasharray:2 4}
    </style>
  </defs>

  <rect x="0" y="0" width="1320" height="1300" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="48" class="title">FinVet — LangGraph StateGraph</text>
  <text x="40" y="74" class="sub">12 nodes · 3 ReAct agent subgraphs · conditional routing (exactly one branch runs) · interrupt-based human review</text>

  <!-- Legend row 1: edges -->
  <line x1="42" y1="104" x2="80" y2="104" class="edge" marker-end="url(#arr)"/>
  <text x="88" y="108" class="leg">static edge</text>
  <line x1="190" y1="104" x2="228" y2="104" class="cond" marker-end="url(#arr)"/>
  <text x="236" y="108" class="leg">conditional edge</text>
  <line x1="372" y1="104" x2="410" y2="104" class="edge" stroke="#7c3aed" marker-end="url(#arrA2A)"/>
  <text x="418" y="108" class="leg">A2A call (sec→news)</text>
  <line x1="580" y1="104" x2="618" y2="104" class="chan" marker-end="url(#arr)"/>
  <text x="626" y="108" class="leg">state / persistence channel</text>
  <line x1="812" y1="104" x2="850" y2="104" class="edge" stroke="#ef4444" marker-end="url(#arrRed)"/>
  <text x="858" y="108" class="elblr">raises → exits graph (HTTP 400)</text>

  <!-- Legend row 2: color = who decides -->
  <text x="40" y="136" class="legk">COLOR = WHO DECIDES</text>
  <rect x="210" y="126" width="16" height="13" rx="3" fill="#eaf2fe" stroke="#3b82f6"/>
  <text x="232" y="136" class="leg">LLM inference</text>
  <rect x="340" y="126" width="16" height="13" rx="3" fill="#eafaf0" stroke="#22a35a"/>
  <text x="362" y="136" class="leg">ReAct agent subgraph (cyclic)</text>
  <rect x="576" y="126" width="16" height="13" rx="3" fill="#f1f3f6" stroke="#94a3b8"/>
  <text x="598" y="136" class="leg">deterministic Python</text>
  <rect x="742" y="126" width="16" height="13" rx="3" fill="#fff7ea" stroke="#f59e0b"/>
  <text x="764" y="136" class="leg">human review</text>
  <rect x="852" y="126" width="16" height="13" rx="3" fill="#fdecec" stroke="#ef4444"/>
  <text x="874" y="136" class="leg">rejected / terminal</text>

  <line x1="40" y1="156" x2="1280" y2="156" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= LEFT PANEL ================= -->
  <rect x="40" y="178" width="232" height="946" rx="10" fill="#fbfcfe" stroke="#e2e8f0"/>

  <text x="58" y="208" class="pt">State (TypedDict)</text>
  <line x1="58" y1="216" x2="254" y2="216" stroke="#e2e8f0"/>
  <text x="58" y="236" class="mono">claim_raw : str</text>
  <text x="58" y="254" class="mono">parsed_claim : ParsedClaim</text>
  <text x="58" y="272" class="mono">canonical_period : Period</text>
  <text x="58" y="290" class="mono">agent_evidence : dict</text>
  <text x="58" y="308" class="mono">verdict · confidence</text>
  <text x="58" y="326" class="mono">hitl_required : bool</text>
  <text x="58" y="344" class="mono">audit_events : list</text>
  <text x="58" y="362" class="mono">messages : add_messages</text>

  <text x="58" y="398" class="pt">Verdict</text>
  <line x1="58" y1="406" x2="254" y2="406" stroke="#e2e8f0"/>
  <text x="58" y="426" class="pk" fill="#16a34a">SUPPORTS</text>
  <text x="58" y="444" class="pk" fill="#dc2626">REFUTES</text>
  <text x="58" y="462" class="pk" fill="#64748b">NOT_ENOUGH_INFO</text>

  <text x="58" y="498" class="pt">How the verdict is set</text>
  <line x1="58" y1="506" x2="254" y2="506" stroke="#e2e8f0"/>
  <text x="58" y="525" class="pv">A 2nd LLM call extracts the</text>
  <text x="58" y="541" class="pv">verdict on a filtered history</text>
  <text x="58" y="557" class="pv">(anti-anchoring). Python</text>
  <text x="58" y="573" class="pv">_apply_override wins whenever</text>
  <text x="58" y="589" class="pv">a numeric comparison exists.</text>
  <text x="58" y="605" class="pv">Consensus adjusts confidence</text>
  <text x="58" y="621" class="pv">only — it never rewrites verdict.</text>

  <text x="58" y="658" class="pt">Compile</text>
  <line x1="58" y1="666" x2="254" y2="666" stroke="#e2e8f0"/>
  <text x="58" y="686" class="mono">graph.compile(</text>
  <text x="58" y="703" class="mono">  checkpointer=</text>
  <text x="58" y="720" class="mono">    MemorySaver(),</text>
  <text x="58" y="737" class="mono">  interrupt_before=</text>
  <text x="58" y="754" class="mono">    ["hitl_checkpoint"],</text>
  <text x="58" y="771" class="mono">)</text>

  <text x="58" y="808" class="pt">Topology</text>
  <line x1="58" y1="816" x2="254" y2="816" stroke="#e2e8f0"/>
  <text x="58" y="836" class="pv">12 nodes · 3 ReAct subgraphs</text>
  <text x="58" y="854" class="pv">4-way conditional after parse</text>
  <text x="58" y="872" class="pv">2-way conditional at output</text>
  <text x="58" y="890" class="pv">1 interrupt point (HITL)</text>
  <text x="58" y="908" class="pv">≤ 5 tool iterations / agent</text>

  <text x="58" y="944" class="pt">Contract</text>
  <line x1="58" y1="952" x2="254" y2="952" stroke="#e2e8f0"/>
  <text x="58" y="972" class="pv">Every node receives the full</text>
  <text x="58" y="988" class="pv">State and returns a partial</text>
  <text x="58" y="1004" class="pv">update; reducers merge</text>
  <text x="58" y="1020" class="pv">concurrent agent writes.</text>

  <text x="58" y="1056" class="pt">Disposition (at respond)</text>
  <line x1="58" y1="1064" x2="254" y2="1064" stroke="#e2e8f0"/>
  <text x="58" y="1083" class="pv">released · pending_review ·</text>
  <text x="58" y="1099" class="pv">rejected_parser · approved_ /</text>
  <text x="58" y="1115" class="pv">overridden_ / rejected_human</text>

  <!-- ================= MAIN FLOW ================= -->

  <!-- START -->
  <rect x="708" y="176" width="120" height="38" rx="19" fill="#e8ebf0" stroke="#475569"/>
  <text x="768" y="200" text-anchor="middle" class="term">START</text>
  <line x1="768" y1="214" x2="768" y2="246" class="edge" marker-end="url(#arr)"/>

  <!-- input_guardrails (deterministic/gray — regex always-on, Llama Guard optional) -->
  <rect x="663" y="248" width="210" height="54" rx="9" fill="#f1f3f6" stroke="#94a3b8"/>
  <text x="768" y="270" text-anchor="middle" class="nh" fill="#334155">input_guardrails</text>
  <text x="768" y="290" text-anchor="middle" class="ns">regex + PII · optional Llama Guard (safety)</text>

  <!-- unsafe -> HTTP 400 exit -->
  <path d="M663,275 H470" class="edge" stroke="#ef4444" stroke-dasharray="6 5" marker-end="url(#arrRed)"/>
  <rect x="300" y="256" width="164" height="40" rx="8" fill="#fdecec" stroke="#ef4444"/>
  <text x="382" y="272" text-anchor="middle" class="nh" fill="#dc2626" font-size="13">HTTP 400</text>
  <text x="382" y="289" text-anchor="middle" class="ns" fill="#b91c1c">no verdict · no audit row</text>
  <text x="560" y="269" class="elblr">unsafe →</text>

  <line x1="768" y1="302" x2="768" y2="326" class="edge" marker-end="url(#arr)"/>

  <!-- claim_parser (LLM/blue) -->
  <rect x="663" y="328" width="210" height="54" rx="9" fill="#eaf2fe" stroke="#3b82f6"/>
  <text x="768" y="350" text-anchor="middle" class="nh" fill="#1d4ed8">claim_parser</text>
  <text x="768" y="370" text-anchor="middle" class="ns">LLM → 7-field structured claim</text>

  <!-- 4-way conditional fan-out -->
  <!-- to period_resolver (sec) -->
  <path d="M700,382 C560,410 470,410 470,430" class="cond" marker-end="url(#arr)"/>
  <text x="486" y="410" class="elbl">"sec"</text>
  <!-- to news_agent -->
  <path d="M768,382 V520" class="cond" marker-end="url(#arr)"/>
  <text x="778" y="470" class="elbl">"news"</text>
  <!-- to market_agent -->
  <path d="M836,382 C1000,410 1090,410 1090,520" class="cond" marker-end="url(#arr)"/>
  <text x="1010" y="410" class="elbl">"market"</text>
  <!-- to reject_handler -->
  <path d="M663,360 C470,360 356,470 356,700" class="cond" marker-end="url(#arr)"/>
  <rect x="298" y="612" width="58" height="18" rx="4" fill="#ffffff"/>
  <text x="304" y="626" class="elblr">"reject"</text>

  <!-- period_resolver (deterministic/gray) -->
  <rect x="375" y="430" width="190" height="50" rx="9" fill="#f1f3f6" stroke="#94a3b8"/>
  <text x="470" y="450" text-anchor="middle" class="nh" fill="#334155" font-size="14">period_resolver</text>
  <text x="470" y="468" text-anchor="middle" class="ns">fiscal/relative → dates (SEC only)</text>
  <line x1="470" y1="480" x2="470" y2="518" class="edge" marker-end="url(#arr)"/>

  <!-- sec_agent (green subgraph) -->
  <rect x="375" y="520" width="190" height="104" rx="11" fill="#eafaf0" stroke="#22a35a" stroke-width="1.6"/>
  <text x="470" y="543" text-anchor="middle" class="nh" fill="#15803d">sec_agent</text>
  <text x="470" y="561" text-anchor="middle" class="ns">ReAct loop · ≤ 5 iters ↻</text>
  <text x="470" y="590" text-anchor="middle" class="badge">MCP · SEC EDGAR (XBRL)</text>
  <text x="470" y="606" text-anchor="middle" class="badge">hybrid RAG · A2A · memory</text>

  <!-- news_agent (green subgraph) -->
  <rect x="675" y="520" width="190" height="104" rx="11" fill="#eafaf0" stroke="#22a35a" stroke-width="1.6"/>
  <text x="770" y="543" text-anchor="middle" class="nh" fill="#15803d">news_agent</text>
  <text x="770" y="561" text-anchor="middle" class="ns">ReAct loop · ≤ 5 iters ↻</text>
  <text x="770" y="590" text-anchor="middle" class="badge">API · Tavily search</text>
  <text x="770" y="606" text-anchor="middle" class="badge">FRED macro · memory</text>

  <!-- market_agent (green subgraph) -->
  <rect x="975" y="520" width="190" height="104" rx="11" fill="#eafaf0" stroke="#22a35a" stroke-width="1.6"/>
  <text x="1070" y="543" text-anchor="middle" class="nh" fill="#15803d">market_agent</text>
  <text x="1070" y="561" text-anchor="middle" class="ns">ReAct loop · ≤ 5 iters ↻</text>
  <text x="1070" y="590" text-anchor="middle" class="badge">API · Finnhub</text>
  <text x="1070" y="606" text-anchor="middle" class="badge">memory</text>

  <!-- A2A sec -> news -->
  <line x1="565" y1="556" x2="675" y2="556" class="edge" stroke="#7c3aed" marker-end="url(#arrA2A)"/>
  <text x="590" y="548" class="elbl" fill="#7c3aed">A2A</text>

  <!-- agents converge to consensus -->
  <path d="M470,624 V656 H768" class="edge"/>
  <path d="M1070,624 V656 H768" class="edge"/>
  <path d="M770,624 V674" class="edge" marker-end="url(#arr)"/>
  <line x1="768" y1="656" x2="768" y2="674" class="edge" marker-end="url(#arr)"/>

  <!-- consensus (deterministic/gray) -->
  <rect x="663" y="676" width="210" height="54" rx="9" fill="#f1f3f6" stroke="#94a3b8"/>
  <text x="768" y="698" text-anchor="middle" class="nh" fill="#334155">consensus</text>
  <text x="768" y="718" text-anchor="middle" class="ns">merges evidence · adjusts confidence</text>
  <line x1="768" y1="730" x2="768" y2="762" class="edge" marker-end="url(#arr)"/>

  <!-- output_guardrails (deterministic/gray) -->
  <rect x="663" y="764" width="210" height="54" rx="9" fill="#f1f3f6" stroke="#94a3b8"/>
  <text x="768" y="786" text-anchor="middle" class="nh" fill="#334155">output_guardrails</text>
  <text x="768" y="806" text-anchor="middle" class="ns">safety · confidence threshold</text>

  <!-- needs_hitl branch -->
  <path d="M873,791 H975" class="cond" marker-end="url(#arr)"/>
  <text x="884" y="784" class="elbl">conf &lt; 0.70</text>
  <text x="884" y="798" class="elbl">OR safety</text>

  <!-- no_hitl branch -->
  <path d="M768,818 V908" class="cond" marker-end="url(#arr)"/>
  <text x="778" y="866" class="elbl">conf ≥ 0.70</text>

  <!-- hitl_checkpoint (human/orange) -->
  <rect x="975" y="764" width="190" height="52" rx="9" fill="#fff7ea" stroke="#f59e0b"/>
  <text x="1070" y="785" text-anchor="middle" class="nh" fill="#b45309" font-size="14">hitl_checkpoint</text>
  <text x="1070" y="803" text-anchor="middle" class="ns">interrupt_before · state paused</text>
  <line x1="1070" y1="816" x2="1070" y2="842" class="edge" marker-end="url(#arr)"/>

  <!-- apply_hitl_decision (human/orange) -->
  <rect x="975" y="844" width="190" height="52" rx="9" fill="#fff7ea" stroke="#f59e0b"/>
  <text x="1070" y="865" text-anchor="middle" class="nh" fill="#b45309" font-size="14">apply_hitl_decision</text>
  <text x="1070" y="883" text-anchor="middle" class="ns">approve · override · reject</text>
  <path d="M975,882 C900,905 880,912 873,922" class="edge" marker-end="url(#arr)"/>

  <!-- reject_handler (red) -->
  <rect x="272" y="700" width="168" height="54" rx="9" fill="#fdecec" stroke="#ef4444"/>
  <text x="356" y="722" text-anchor="middle" class="nh" fill="#dc2626" font-size="14">reject_handler</text>
  <text x="356" y="741" text-anchor="middle" class="ns">any reject_reason</text>
  <path d="M356,754 V925 H663" class="edge" marker-end="url(#arr)"/>
  <rect x="398" y="903" width="150" height="18" rx="4" fill="#ffffff"/>
  <text x="404" y="917" class="elbl">→ HTTP 200 · audit row</text>

  <!-- response_generator (deterministic/gray) -->
  <rect x="663" y="910" width="210" height="60" rx="9" fill="#f1f3f6" stroke="#94a3b8"/>
  <text x="768" y="933" text-anchor="middle" class="nh" fill="#334155">response_generator</text>
  <text x="768" y="951" text-anchor="middle" class="ns">verdict · confidence · evidence</text>
  <text x="768" y="964" text-anchor="middle" class="badge">records disposition</text>
  <line x1="768" y1="970" x2="768" y2="1000" class="edge" marker-end="url(#arr)"/>

  <!-- END -->
  <rect x="708" y="1002" width="120" height="38" rx="19" fill="#e8ebf0" stroke="#475569"/>
  <text x="768" y="1026" text-anchor="middle" class="term">END</text>

  <!-- ============ BOTTOM BANDS ============ -->
  <!-- persistence channel from response to bands -->
  <path d="M873,940 C960,940 1000,1080 900,1090" class="chan"/>

  <rect x="300" y="1088" width="980" height="104" rx="10" fill="#fbfcfe" stroke="#e2e8f0"/>

  <text x="320" y="1116" class="pk" fill="#b45309">Checkpointer — MemorySaver (in-process)</text>
  <text x="320" y="1136" class="pv">Enables interrupt / resume within a</text>
  <text x="320" y="1152" class="pv">running process — NOT PostgresSaver.</text>
  <text x="320" y="1168" class="pv">A restart discards a paused HITL review;</text>
  <text x="320" y="1184" class="pv">its audit_executions row stays PENDING.</text>

  <line x1="792" y1="1104" x2="792" y2="1172" stroke="#e2e8f0"/>
  <text x="812" y="1116" class="pk" fill="#334155">Immutable audit trail — SQLAlchemy</text>
  <text x="812" y="1136" class="pv">audit_events + audit_executions with a</text>
  <text x="812" y="1152" class="pv">SHA-256 execution_hash per run.</text>
  <text x="812" y="1168" class="pv">A separate store; survives restarts.</text>
</svg>
