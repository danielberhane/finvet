<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D97706"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#F8FAFC" rx="12"/>

  <!-- Title -->
  <rect x="0" y="0" width="1200" height="56" fill="url(#headerGrad)" rx="12"/>
  <rect x="0" y="40" width="1200" height="16" fill="url(#headerGrad)"/>
  <text x="600" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">LangGraph Pipeline — 12-Node DAG with HITL Checkpoint</text>

  <!-- ============ ROW 1: Entry ============ -->

  <!-- START node -->
  <circle cx="100" cy="130" r="18" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="100" y="135" text-anchor="middle" fill="white" font-size="10" font-weight="700">START</text>

  <line x1="118" y1="130" x2="158" y2="130" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 1: Input Guardrails -->
  <rect x="160" y="100" width="170" height="60" rx="10" fill="white" stroke="#FECACA" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="160" y="100" width="4" height="60" rx="2" fill="#EF4444"/>
  <text x="184" y="126" fill="#1E293B" font-size="12" font-weight="700">Input Guardrails</text>
  <text x="184" y="144" fill="#64748B" font-size="9">Regex + PII + Llama Guard</text>
  <text x="316" y="118" fill="#94A3B8" font-size="9" text-anchor="end">#1</text>

  <line x1="330" y1="130" x2="378" y2="130" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 2: Claim Parser -->
  <rect x="380" y="100" width="170" height="60" rx="10" fill="white" stroke="#BFDBFE" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="380" y="100" width="4" height="60" rx="2" fill="#3B82F6"/>
  <text x="404" y="126" fill="#1E293B" font-size="12" font-weight="700">Claim Parser</text>
  <text x="404" y="144" fill="#64748B" font-size="9">LLM → ParsedClaim (7 fields)</text>
  <text x="536" y="118" fill="#94A3B8" font-size="9" text-anchor="end">#2</text>

  <!-- Conditional routing label -->
  <g transform="translate(550, 108)">
    <rect x="0" y="0" width="78" height="20" rx="10" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="39" y="14" text-anchor="middle" fill="#92400E" font-size="9" font-weight="600">CONDITIONAL</text>
  </g>

  <!-- ============ ROW 2: Routing branches ============ -->

  <!-- Branch: SEC (top) -->
  <path d="M 550 130 L 580 130 L 600 200" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="565" y="174" fill="#8B5CF6" font-size="9" font-weight="600">sec</text>

  <!-- Node 3: Period Resolver -->
  <rect x="560" y="202" width="170" height="60" rx="10" fill="white" stroke="#DDD6FE" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="560" y="202" width="4" height="60" rx="2" fill="#8B5CF6"/>
  <text x="584" y="228" fill="#1E293B" font-size="12" font-weight="700">Period Resolver</text>
  <text x="584" y="246" fill="#64748B" font-size="9">Calendar → CanonicalPeriod</text>
  <text x="716" y="220" fill="#94A3B8" font-size="9" text-anchor="end">#3</text>

  <line x1="730" y1="232" x2="778" y2="232" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 4: SEC Agent -->
  <rect x="780" y="202" width="170" height="60" rx="10" fill="white" stroke="#A7F3D0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="780" y="202" width="4" height="60" rx="2" fill="#10B981"/>
  <text x="804" y="228" fill="#1E293B" font-size="12" font-weight="700">SEC Agent</text>
  <text x="804" y="246" fill="#64748B" font-size="9">ReAct · XBRL · RAG · A2A</text>
  <text x="936" y="220" fill="#94A3B8" font-size="9" text-anchor="end">#4</text>

  <!-- Branch: Market (middle) -->
  <path d="M 550 130 L 580 130 L 780 326" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="700" y="260" fill="#8B5CF6" font-size="9" font-weight="600">market</text>

  <!-- Node 5: Market Agent -->
  <rect x="780" y="306" width="170" height="60" rx="10" fill="white" stroke="#A7F3D0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="780" y="306" width="4" height="60" rx="2" fill="#10B981"/>
  <text x="804" y="332" fill="#1E293B" font-size="12" font-weight="700">Market Agent</text>
  <text x="804" y="350" fill="#64748B" font-size="9">ReAct · Finnhub</text>
  <text x="936" y="324" fill="#94A3B8" font-size="9" text-anchor="end">#5</text>

  <!-- Branch: News (lower) -->
  <path d="M 550 130 L 580 130 L 780 430" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="700" y="350" fill="#8B5CF6" font-size="9" font-weight="600">news</text>

  <!-- Node 6: News Agent -->
  <rect x="780" y="410" width="170" height="60" rx="10" fill="white" stroke="#A7F3D0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="780" y="410" width="4" height="60" rx="2" fill="#10B981"/>
  <text x="804" y="436" fill="#1E293B" font-size="12" font-weight="700">News Agent</text>
  <text x="804" y="454" fill="#64748B" font-size="9">ReAct · Tavily Search</text>
  <text x="936" y="428" fill="#94A3B8" font-size="9" text-anchor="end">#6</text>

  <!-- Branch: Reject (bottom) -->
  <path d="M 550 130 L 580 130 L 580 540 L 618 540" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="558" y="476" fill="#EF4444" font-size="9" font-weight="600">reject</text>

  <!-- Node 7: Reject Handler -->
  <rect x="620" y="510" width="170" height="60" rx="10" fill="white" stroke="#FECACA" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="620" y="510" width="4" height="60" rx="2" fill="#EF4444"/>
  <text x="644" y="536" fill="#1E293B" font-size="12" font-weight="700">Reject Handler</text>
  <text x="644" y="554" fill="#64748B" font-size="9">verdict=REJECTED, skip pipeline</text>
  <text x="776" y="528" fill="#94A3B8" font-size="9" text-anchor="end">#7</text>

  <!-- ============ CONVERGENCE ============ -->

  <!-- Arrows from agents to Consensus -->
  <path d="M 950 232 L 1000 232 L 1000 336 L 1020 336" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 950 336 L 1020 336" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 950 440 L 1000 440 L 1000 336 L 1020 336" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 8: Consensus -->
  <rect x="1022" y="306" width="150" height="60" rx="10" fill="white" stroke="#DDD6FE" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1022" y="306" width="4" height="60" rx="2" fill="#8B5CF6"/>
  <text x="1046" y="332" fill="#1E293B" font-size="12" font-weight="700">Consensus</text>
  <text x="1046" y="350" fill="#64748B" font-size="9">Confidence adjustments</text>
  <text x="1158" y="324" fill="#94A3B8" font-size="9" text-anchor="end">#8</text>

  <!-- ============ ROW 3: Post-consensus ============ -->

  <!-- Arrow down from Consensus -->
  <line x1="1097" y1="366" x2="1097" y2="420" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 9: Output Guardrails -->
  <rect x="1022" y="422" width="150" height="60" rx="10" fill="white" stroke="#FECACA" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1022" y="422" width="4" height="60" rx="2" fill="#EF4444"/>
  <text x="1046" y="448" fill="#1E293B" font-size="12" font-weight="700">Output Guardrails</text>
  <text x="1046" y="466" fill="#64748B" font-size="9">Confidence + safety check</text>
  <text x="1158" y="440" fill="#94A3B8" font-size="9" text-anchor="end">#9</text>

  <!-- Conditional after output guardrails -->
  <g transform="translate(1034, 486)">
    <rect x="0" y="0" width="78" height="18" rx="9" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="39" y="13" text-anchor="middle" fill="#92400E" font-size="8" font-weight="600">CONDITIONAL</text>
  </g>

  <!-- Branch: needs_hitl -->
  <path d="M 1022 470 L 920 470 L 920 520 L 940 520" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="932" y="498" fill="#D97706" font-size="9" font-weight="600">needs HITL</text>

  <!-- Node 10: HITL Checkpoint -->
  <rect x="180" y="490" width="170" height="60" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2" filter="url(#shadow)"/>
  <rect x="180" y="490" width="4" height="60" rx="2" fill="#F59E0B"/>
  <text x="204" y="516" fill="#1E293B" font-size="12" font-weight="700">HITL Checkpoint</text>
  <text x="204" y="534" fill="#92400E" font-size="9">interrupt_before (graph pauses)</text>
  <text x="336" y="508" fill="#94A3B8" font-size="9" text-anchor="end">#10</text>

  <!-- Arrow: HITL -> Apply -->
  <path d="M 940 520 L 350 520" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="500" y="515" fill="#D97706" font-size="8">Human reviews → API resumes graph</text>

  <line x1="265" y1="550" x2="265" y2="600" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 11: Apply HITL Decision -->
  <rect x="180" y="602" width="170" height="60" rx="10" fill="white" stroke="#FDE68A" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="180" y="602" width="4" height="60" rx="2" fill="#F59E0B"/>
  <text x="204" y="628" fill="#1E293B" font-size="12" font-weight="700">Apply HITL Decision</text>
  <text x="204" y="646" fill="#64748B" font-size="9">approve / override / reject</text>
  <text x="336" y="620" fill="#94A3B8" font-size="9" text-anchor="end">#11</text>

  <!-- Branch: direct to response -->
  <path d="M 1097 482 L 1097 620 L 1040 620" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1104" y="560" fill="#64748B" font-size="9" font-weight="600">OK</text>

  <!-- Arrow from Apply HITL to Response Gen -->
  <line x1="350" y1="632" x2="862" y2="632" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow from Reject Handler to Response Gen -->
  <path d="M 790 540 L 830 540 L 830 620 L 862 620" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 12: Response Generator -->
  <rect x="864" y="598" width="178" height="60" rx="10" fill="white" stroke="#BFDBFE" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="864" y="598" width="4" height="60" rx="2" fill="#3B82F6"/>
  <text x="888" y="624" fill="#1E293B" font-size="12" font-weight="700">Response Generator</text>
  <text x="888" y="642" fill="#64748B" font-size="9">Format final_response dict</text>
  <text x="1028" y="616" fill="#94A3B8" font-size="9" text-anchor="end">#12</text>

  <!-- END node -->
  <circle cx="1097" cy="628" r="18" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <circle cx="1097" cy="628" r="14" fill="#1E293B" stroke="white" stroke-width="2"/>
  <text x="1097" y="633" text-anchor="middle" fill="white" font-size="9" font-weight="700">END</text>

  <!-- Legend -->
  <rect x="40" y="656" width="500" height="34" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(56, 668)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#EF4444"/>
    <text x="14" y="10" fill="#64748B" font-size="9">Guards</text>
  </g>
  <g transform="translate(116, 668)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#3B82F6"/>
    <text x="14" y="10" fill="#64748B" font-size="9">LLM Nodes</text>
  </g>
  <g transform="translate(206, 668)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#10B981"/>
    <text x="14" y="10" fill="#64748B" font-size="9">Agents (ReAct)</text>
  </g>
  <g transform="translate(316, 668)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#8B5CF6"/>
    <text x="14" y="10" fill="#64748B" font-size="9">Pipeline Logic</text>
  </g>
  <g transform="translate(426, 668)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#F59E0B"/>
    <text x="14" y="10" fill="#64748B" font-size="9">HITL</text>
  </g>
</svg>