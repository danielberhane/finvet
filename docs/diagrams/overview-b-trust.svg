<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-label="FinVet system overview. The model panel holds the claim parser and the agent loop with its four sources; the code panel holds the comparator, the response and the human review; the input and output guards sit in the gap between them; the interface is the band at the top and the audit trail the base." font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f4a4d"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8f8f"/></marker>
  </defs>

  <rect width="1200" height="920" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="880" fill="#a3c4c3"/>
  <text x="600" y="68" text-anchor="middle" font-size="28" fill="#2f4a4d">FinVet · agentic financial claim verification</text>

  <!-- interface band -->
  <rect x="40" y="92" width="1120" height="100" fill="#d6e8db"/>
  <text x="600" y="180" text-anchor="middle" font-size="16" fill="#3d5f61">Interface</text>
  <rect x="300" y="104" width="280" height="62" fill="#5f8a88"/>
  <text x="440" y="131" text-anchor="middle" font-size="21" fill="#ffffff">Streamlit UI</text>
  <text x="440" y="153" text-anchor="middle" font-size="14" fill="#ffffff">one claim at a time</text>
  <rect x="620" y="104" width="280" height="62" fill="#5f8a88"/>
  <text x="760" y="131" text-anchor="middle" font-size="21" fill="#ffffff">FastAPI</text>
  <text x="760" y="153" text-anchor="middle" font-size="14" fill="#ffffff">/verify · /review · /audit</text>

  <!-- panels -->
  <rect x="40" y="212" width="480" height="580" fill="#d6e8db"/>
  <text x="280" y="246" text-anchor="middle" font-size="17" fill="#3d5f61">Model · proposes</text>
  <rect x="680" y="212" width="480" height="580" fill="#d6e8db"/>
  <text x="920" y="246" text-anchor="middle" font-size="17" fill="#3d5f61">Code · decides</text>
  <text x="600" y="246" text-anchor="middle" font-size="13" fill="#2f4a4d">trust boundary</text>

  <!-- input guard and parser -->
  <rect x="530" y="270" width="140" height="66" fill="#c5d879"/>
  <text x="600" y="297" text-anchor="middle" font-size="18" fill="#2f4a4d">Input guard</text>
  <text x="600" y="320" text-anchor="middle" font-size="12" fill="#2f4a4d">regex · PII · Llama Guard</text>
  <path d="M760,166 V303 H674" stroke="#2f4a4d" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <text x="722" y="295" text-anchor="middle" font-size="13" fill="#2f4a4d">claim</text>
  <rect x="80" y="270" width="400" height="66" fill="#5f8a88"/>
  <text x="280" y="297" text-anchor="middle" font-size="21" fill="#ffffff">Claim parser</text>
  <text x="280" y="320" text-anchor="middle" font-size="14" fill="#ffffff">seven fields, or reject</text>
  <path d="M530,303 H484" stroke="#2f4a4d" stroke-width="2" fill="none" marker-end="url(#t)"/>

  <!-- agent loop -->
  <rect x="80" y="400" width="400" height="200" fill="#5f8a88"/>
  <text x="280" y="432" text-anchor="middle" font-size="21" fill="#ffffff">Agent loop</text>
  <text x="280" y="456" text-anchor="middle" font-size="14" fill="#ffffff">SEC, market or news · at most 8 tool steps</text>
  <g fill="#c9dcd7">
    <rect x="96" y="476" width="88" height="104"/><rect x="192" y="476" width="88" height="104"/>
    <rect x="288" y="476" width="88" height="104"/><rect x="384" y="476" width="80" height="104"/>
  </g>
  <g font-size="14" fill="#2f4a4d" text-anchor="middle">
    <text x="140" y="520">SEC</text><text x="140" y="540">EDGAR</text>
    <text x="236" y="520">Filing</text><text x="236" y="540">text</text>
    <text x="332" y="520">Finnhub</text><text x="332" y="540">quotes</text>
    <text x="424" y="520">Tavily</text><text x="424" y="540">news</text>
  </g>
  <path d="M280,336 V396" stroke="#2f4a4d" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <text x="296" y="372" text-anchor="start" font-size="13" fill="#2f4a4d">parsed claim</text>

  <!-- comparator -->
  <rect x="720" y="440" width="400" height="84" fill="#3f6f6d"/>
  <text x="920" y="475" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff">Comparator</text>
  <text x="920" y="502" text-anchor="middle" font-size="14" fill="#ffffff">figure vs claim, fixed tolerance</text>
  <path d="M480,468 H716" stroke="#2f4a4d" stroke-width="4" fill="none" marker-end="url(#t)"/>
  <text x="600" y="458" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a4d">figure + provenance</text>
  <path d="M480,508 H716" stroke="#6f8f8f" stroke-width="1.5" stroke-dasharray="4 5" fill="none" marker-end="url(#w)"/>
  <text x="600" y="528" text-anchor="middle" font-size="13" fill="#3d5f61">model's verdict · advice only</text>

  <!-- output guard -->
  <rect x="530" y="620" width="140" height="66" fill="#c5d879"/>
  <text x="600" y="647" text-anchor="middle" font-size="18" fill="#2f4a4d">Output guard</text>
  <text x="600" y="670" text-anchor="middle" font-size="12" fill="#2f4a4d">safety · review triggers</text>
  <path d="M920,524 V653 H674" stroke="#2f4a4d" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <text x="800" y="645" text-anchor="middle" font-size="13" fill="#2f4a4d">verdict</text>

  <!-- response and human review -->
  <rect x="700" y="710" width="200" height="66" fill="#5f8a88"/>
  <text x="800" y="737" text-anchor="middle" font-size="21" fill="#ffffff">Response</text>
  <text x="800" y="760" text-anchor="middle" font-size="14" fill="#ffffff">verdict · figure · evidence</text>
  <rect x="940" y="710" width="200" height="66" fill="#c9dcd7"/>
  <text x="1040" y="737" text-anchor="middle" font-size="21" fill="#2f4a4d">Human review</text>
  <text x="1040" y="760" text-anchor="middle" font-size="14" fill="#2f4a4d">only when triggered</text>
  <path d="M600,686 V743 H696" stroke="#2f4a4d" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <path d="M640,686 V698 H1040 V706" stroke="#6f8f8f" stroke-width="1.5" stroke-dasharray="4 5" fill="none" marker-end="url(#w)"/>
  <text x="960" y="692" text-anchor="middle" font-size="13" fill="#3d5f61">triggered</text>
  <path d="M940,743 H904" stroke="#2f4a4d" stroke-width="2" fill="none" marker-end="url(#t)"/>

  <!-- audit base -->
  <rect x="40" y="812" width="1120" height="68" fill="#3f6f6d"/>
  <text x="600" y="842" text-anchor="middle" font-size="21" fill="#ffffff">Audit trail</text>
  <text x="600" y="866" text-anchor="middle" font-size="14" fill="#ffffff">every tool call and verdict, checksummed</text>
</svg>
