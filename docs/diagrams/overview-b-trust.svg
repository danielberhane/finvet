<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="FinVet's trust boundary: the model parses the claim and retrieves evidence on the left; code resolves the period, computes the verdict, guards the output and records the audit trail on the right; only a figure with provenance crosses from model to verdict" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <rect width="1200" height="720" rx="14" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">FinVet — the model proposes, code decides</text>

  <!-- two halves -->
  <rect x="30" y="60" width="520" height="630" rx="12" fill="#F7F2FB" stroke="#9673A6" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="650" y="60" width="520" height="630" rx="12" fill="#F9FAFB" stroke="#4b5563" stroke-width="1"/>
  <text x="290" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B3FA0">MODEL · untrusted, proposes</text>
  <text x="910" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">CODE · deterministic, decides</text>
  <line x1="600" y1="60" x2="600" y2="690" stroke="#111827" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="708" text-anchor="middle" font-size="11" fill="#4b5563">trust boundary — what crosses it is labelled</text>

  <!-- right column, top: entry -->
  <g stroke-width="1.5">
    <rect x="700" y="110" width="200" height="54" rx="8" fill="#ffffff" stroke="#4b5563"/>
    <rect x="940" y="110" width="200" height="54" rx="8" fill="#FFF2CC" stroke="#D6B656"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#111827" text-anchor="middle"><text x="800" y="133">API /verify</text><text x="1040" y="133">Input guards</text></g>
  <g font-size="11" fill="#4b5563" text-anchor="middle"><text x="800" y="152">claim text in</text><text x="1040" y="152">regex · Llama Guard</text></g>
  <line x1="900" y1="137" x2="938" y2="137" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- cross 1: claim text to parser -->
  <rect x="80" y="200" width="200" height="54" rx="8" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.5"/>
  <text x="180" y="223" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Claim parser</text>
  <text x="180" y="242" font-size="11" fill="#4b5563" text-anchor="middle">7 fields, or reject</text>
  <path d="M1040,164 V185 H180 V198" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="610" y="180" font-size="11" fill="#6b7280" text-anchor="middle">claim text</text>

  <!-- cross 2: parse to period resolver -->
  <rect x="700" y="200" width="200" height="54" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="800" y="223" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Period resolver</text>
  <text x="800" y="242" font-size="11" fill="#4b5563" text-anchor="middle">period text → dates</text>
  <line x1="280" y1="227" x2="698" y2="227" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="490" y="220" font-size="11" fill="#6b7280" text-anchor="middle">ticker · metric · operator · value · period</text>

  <!-- cross 3: to agent loop -->
  <rect x="80" y="300" width="400" height="150" rx="8" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.5"/>
  <text x="280" y="325" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Agent loop · one of SEC, market, news</text>
  <text x="280" y="344" font-size="11" fill="#4b5563" text-anchor="middle">model picks a tool, reads the result, picks again · ≤ 8 steps</text>
  <g stroke="#4b5563" stroke-width="1.2" fill="#ffffff">
    <rect x="100" y="365" width="85" height="40" rx="6"/><rect x="195" y="365" width="85" height="40" rx="6"/>
    <rect x="290" y="365" width="85" height="40" rx="6"/><rect x="385" y="365" width="80" height="40" rx="6"/>
  </g>
  <g font-size="11" fill="#111827" text-anchor="middle">
    <text x="142" y="382">SEC EDGAR</text><text x="142" y="396">XBRL · MCP</text>
    <text x="237" y="382">filing text</text><text x="237" y="396">pgvector</text>
    <text x="332" y="382">Finnhub</text><text x="332" y="396">quotes</text>
    <text x="425" y="382">Tavily</text><text x="425" y="396">news</text>
  </g>
  <text x="280" y="432" font-size="11" fill="#6B3FA0" text-anchor="middle">news → SEC delegation inside the loop · one way · cannot recurse</text>
  <path d="M800,254 V280 H280 V298" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="610" y="275" font-size="11" fill="#6b7280" text-anchor="middle">resolved period</text>

  <!-- cross 4: figure + provenance to comparator; proposed verdict as advisory -->
  <rect x="680" y="330" width="240" height="90" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <text x="800" y="356" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Comparator</text>
  <text x="800" y="376" font-size="11" fill="#4b5563" text-anchor="middle">figure vs claim, fixed tolerance</text>
  <text x="800" y="392" font-size="11" fill="#4b5563" text-anchor="middle">no trusted figure → NOT_ENOUGH_INFO</text>
  <text x="800" y="408" font-size="11" fill="#4b5563" text-anchor="middle">disagreement → both reported</text>
  <line x1="480" y1="362" x2="678" y2="362" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <text x="592" y="346" font-size="11" font-weight="bold" fill="#111827" text-anchor="end">retrieved figure + provenance</text>
  <line x1="480" y1="402" x2="678" y2="402" stroke="#9673A6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="592" y="420" font-size="11" fill="#6B3FA0" text-anchor="end">proposed verdict · advisory only</text>

  <!-- right column, bottom: guards, review, response, audit -->
  <g stroke-width="1.5">
    <rect x="940" y="330" width="200" height="54" rx="8" fill="#FFF2CC" stroke="#D6B656"/>
    <rect x="940" y="430" width="200" height="54" rx="8" fill="#D5E8D4" stroke="#82B366"/>
    <rect x="700" y="470" width="200" height="54" rx="8" fill="#ffffff" stroke="#4b5563"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#111827" text-anchor="middle"><text x="1040" y="353">Output guards</text><text x="1040" y="453">Human review</text><text x="800" y="493">Response</text></g>
  <g font-size="11" fill="#4b5563" text-anchor="middle"><text x="1040" y="372">low confidence · unsafe · conflict</text><text x="1040" y="472">approve · override · reject</text><text x="800" y="512">verdict · figure · evidence</text></g>
  <line x1="920" y1="357" x2="938" y2="357" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M1040,384 V428" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
  <text x="1075" y="410" font-size="11" fill="#6b7280" text-anchor="middle">triggered</text>
  <path d="M940,457 H800 V468" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M1000,384 V410 H800 V468" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="700" y="580" width="440" height="80" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <text x="920" y="606" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Audit trail · PostgreSQL</text>
  <text x="920" y="626" font-size="11" fill="#1f2937" text-anchor="middle">every tool call and verdict, one envelope per request with a checksum</text>
  <text x="920" y="642" font-size="11" fill="#1f2937" text-anchor="middle">every retrieved passage keeps its identity and a content hash</text>
  <path d="M800,524 V578" stroke="#6C8EBF" stroke-width="1.5" stroke-dasharray="2 4" fill="none" marker-end="url(#a)"/>
  <path d="M480,440 H560 V620 H698" stroke="#6C8EBF" stroke-width="1.5" stroke-dasharray="2 4" fill="none" marker-end="url(#a)"/>
  <text x="520" y="540" font-size="11" fill="#6C8EBF" text-anchor="middle">tool calls</text>
</svg>
