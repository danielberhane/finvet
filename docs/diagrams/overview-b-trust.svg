<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-label="FinVet system overview. Two panels, the model that proposes and the code that decides, with the guards in the gap between them. A claim enters through the API and the input guard, the model parses it, code resolves the period, the model runs the agent loop over its sources, code computes the verdict from the retrieved figure, the output guard checks it, a human is consulted only when triggered, and the audit trail at the base records every step." font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5f61"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f9c9c"/></marker>
  </defs>

  <!-- frame -->
  <rect width="1200" height="980" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="940" fill="#a3c4c3"/>
  <text x="600" y="66" text-anchor="middle" font-size="26" fill="#2f4a4d">FinVet · agentic financial claim verification</text>

  <!-- interface band -->
  <rect x="40" y="90" width="1120" height="96" fill="#d6e8db"/>
  <text x="600" y="172" text-anchor="middle" font-size="16" fill="#3d5f61">Interface</text>
  <rect x="300" y="104" width="280" height="54" fill="#7fa5a3"/>
  <text x="440" y="128" text-anchor="middle" font-size="19" fill="#ffffff">Streamlit UI</text>
  <text x="440" y="147" text-anchor="middle" font-size="12" fill="#eaf3f1">one claim at a time</text>
  <rect x="620" y="104" width="280" height="54" fill="#7fa5a3"/>
  <text x="760" y="128" text-anchor="middle" font-size="19" fill="#ffffff">FastAPI</text>
  <text x="760" y="147" text-anchor="middle" font-size="12" fill="#eaf3f1">/verify · /review · /audit</text>

  <!-- model panel -->
  <rect x="40" y="206" width="480" height="640" fill="#d6e8db"/>
  <text x="280" y="238" text-anchor="middle" font-size="16" fill="#3d5f61">Model · proposes</text>
  <!-- code panel -->
  <rect x="680" y="206" width="480" height="640" fill="#d6e8db"/>
  <text x="920" y="238" text-anchor="middle" font-size="16" fill="#3d5f61">Code · decides</text>
  <!-- gap label -->
  <text x="600" y="238" text-anchor="middle" font-size="12" fill="#2f4a4d">trust boundary</text>

  <!-- row 1: API → input guard → parser -->
  <rect x="800" y="262" width="240" height="60" fill="#7fa5a3"/>
  <text x="920" y="288" text-anchor="middle" font-size="19" fill="#ffffff">API</text>
  <text x="920" y="308" text-anchor="middle" font-size="12" fill="#eaf3f1">one claim in</text>
  <rect x="530" y="262" width="140" height="60" fill="#f2a7b6"/>
  <text x="600" y="288" text-anchor="middle" font-size="17" fill="#ffffff">Input guard</text>
  <text x="600" y="308" text-anchor="middle" font-size="11" fill="#ffffff">regex · PII · Llama Guard</text>
  <rect x="80" y="262" width="400" height="60" fill="#7fa5a3"/>
  <text x="280" y="288" text-anchor="middle" font-size="19" fill="#ffffff">Claim parser</text>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#eaf3f1">seven fields, or reject</text>
  <path d="M800,292 H674" stroke="#3d5f61" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <path d="M530,292 H484" stroke="#3d5f61" stroke-width="2" fill="none" marker-end="url(#t)"/>

  <!-- row 2: parser → period resolver -->
  <rect x="800" y="372" width="240" height="60" fill="#7fa5a3"/>
  <text x="920" y="398" text-anchor="middle" font-size="19" fill="#ffffff">Period resolver</text>
  <text x="920" y="418" text-anchor="middle" font-size="12" fill="#eaf3f1">period text → fiscal dates</text>
  <path d="M280,322 V402 H796" stroke="#3d5f61" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <text x="600" y="394" text-anchor="middle" font-size="12" fill="#2f4a4d">parsed claim</text>

  <!-- row 3: period → agent loop -->
  <rect x="80" y="482" width="400" height="150" fill="#7fa5a3"/>
  <text x="280" y="512" text-anchor="middle" font-size="19" fill="#ffffff">Agent loop</text>
  <text x="280" y="532" text-anchor="middle" font-size="12" fill="#eaf3f1">SEC, market or news · picks a tool, reads, picks again · at most 8 steps</text>
  <g fill="#9fc2bc">
    <rect x="96" y="552" width="88" height="60"/><rect x="192" y="552" width="88" height="60"/>
    <rect x="288" y="552" width="88" height="60"/><rect x="384" y="552" width="80" height="60"/>
  </g>
  <g font-size="12" fill="#ffffff" text-anchor="middle">
    <text x="140" y="578">SEC EDGAR</text><text x="140" y="594">XBRL facts</text>
    <text x="236" y="578">Filing text</text><text x="236" y="594">search</text>
    <text x="332" y="578">Finnhub</text><text x="332" y="594">quotes</text>
    <text x="424" y="578">Tavily</text><text x="424" y="594">news</text>
  </g>
  <path d="M920,432 V512 H484" stroke="#3d5f61" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <text x="600" y="504" text-anchor="middle" font-size="12" fill="#2f4a4d">resolved period</text>

  <!-- row 4: loop → comparator -->
  <rect x="800" y="542" width="240" height="90" fill="#5e8c8a"/>
  <text x="920" y="574" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Comparator</text>
  <text x="920" y="596" text-anchor="middle" font-size="12" fill="#eaf3f1">figure vs claim · fixed tolerance</text>
  <text x="920" y="614" text-anchor="middle" font-size="12" fill="#eaf3f1">no trusted figure → declined</text>
  <path d="M480,580 H796" stroke="#3d5f61" stroke-width="3.5" fill="none" marker-end="url(#t)"/>
  <text x="600" y="570" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a4d">figure + provenance</text>
  <path d="M480,612 H796" stroke="#7f9c9c" stroke-width="1.5" stroke-dasharray="4 5" fill="none" marker-end="url(#w)"/>
  <text x="600" y="630" text-anchor="middle" font-size="12" fill="#4f6d6f">model's verdict · advice only</text>

  <!-- row 5: comparator → output guard → response / human review -->
  <rect x="530" y="692" width="140" height="60" fill="#f2a7b6"/>
  <text x="600" y="718" text-anchor="middle" font-size="17" fill="#ffffff">Output guard</text>
  <text x="600" y="738" text-anchor="middle" font-size="11" fill="#ffffff">safety · review triggers</text>
  <path d="M920,632 V722 H674" stroke="#3d5f61" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <text x="760" y="714" text-anchor="middle" font-size="12" fill="#2f4a4d">verdict</text>

  <rect x="700" y="772" width="200" height="60" fill="#7fa5a3"/>
  <text x="800" y="798" text-anchor="middle" font-size="19" fill="#ffffff">Response</text>
  <text x="800" y="818" text-anchor="middle" font-size="12" fill="#eaf3f1">verdict · figure · evidence</text>
  <rect x="940" y="772" width="200" height="60" fill="#9fc2bc"/>
  <text x="1040" y="798" text-anchor="middle" font-size="19" fill="#ffffff">Human review</text>
  <text x="1040" y="818" text-anchor="middle" font-size="12" fill="#ffffff">only when triggered</text>
  <path d="M600,752 V802 H696" stroke="#3d5f61" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <path d="M640,752 V760 H1040 V768" stroke="#7f9c9c" stroke-width="1.5" stroke-dasharray="4 5" fill="none" marker-end="url(#w)"/>
  <text x="960" y="754" text-anchor="middle" font-size="12" fill="#4f6d6f">triggered</text>
  <path d="M940,802 H904" stroke="#3d5f61" stroke-width="2" fill="none" marker-end="url(#t)"/>

  <!-- audit base -->
  <rect x="40" y="866" width="1120" height="74" fill="#5e8c8a"/>
  <text x="600" y="896" text-anchor="middle" font-size="19" fill="#ffffff">Audit trail · PostgreSQL</text>
  <text x="600" y="920" text-anchor="middle" font-size="12" fill="#eaf3f1">every tool call and verdict · one checksummed envelope per request · retrieved passages keep their identity</text>
</svg>
