<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="FinVet in four layers: interface, pipeline, evidence sources, storage; a claim flows through the pipeline left to right, the agent loop reads the evidence sources, and every step writes to the audit trail" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <rect width="1200" height="760" rx="14" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">FinVet — system overview</text>

  <g font-size="12" fill="#6b7280" font-weight="bold">
    <text x="30" y="92">INTERFACE</text><text x="30" y="212">PIPELINE</text><text x="30" y="482">EVIDENCE</text><text x="30" y="632">STORAGE</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1"><line x1="30" y1="180" x2="1170" y2="180"/><line x1="30" y1="450" x2="1170" y2="450"/><line x1="30" y1="600" x2="1170" y2="600"/></g>

  <!-- legend -->
  <g font-size="11" fill="#4b5563">
    <rect x="30" y="104" width="14" height="14" rx="3" fill="#E1D5E7" stroke="#9673A6"/><text x="50" y="115">model</text>
    <rect x="110" y="104" width="14" height="14" rx="3" fill="#ffffff" stroke="#4b5563"/><text x="130" y="115">code</text>
    <rect x="180" y="104" width="14" height="14" rx="3" fill="#FFF2CC" stroke="#D6B656"/><text x="200" y="115">guard</text>
    <rect x="30" y="130" width="14" height="14" rx="3" fill="#D5E8D4" stroke="#82B366"/><text x="50" y="141">human</text>
    <rect x="110" y="130" width="14" height="14" rx="3" fill="#F8CECC" stroke="#B85450"/><text x="130" y="141">declined</text>
    <rect x="180" y="130" width="14" height="14" rx="3" fill="#DAE8FC" stroke="#6C8EBF"/><text x="200" y="141">store</text>
  </g>

  <!-- interface -->
  <g stroke="#4b5563" stroke-width="1.5" fill="#ffffff"><rect x="380" y="70" width="190" height="60" rx="8"/><rect x="630" y="70" width="190" height="60" rx="8"/></g>
  <g font-size="15" font-weight="bold" fill="#111827" text-anchor="middle"><text x="475" y="96">Streamlit UI</text><text x="725" y="96">FastAPI</text></g>
  <g font-size="12" fill="#6b7280" text-anchor="middle"><text x="475" y="116">:8501</text><text x="725" y="116">:8000 · /verify-stream</text></g>
  <line x1="570" y1="100" x2="628" y2="100" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="599" y="92" font-size="11" fill="#6b7280" text-anchor="middle">claim</text>
  <path d="M725,130 V200 H100 V228" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M1100,230 V100 H822" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="960" y="92" font-size="11" fill="#6b7280" text-anchor="middle">response</text>

  <!-- pipeline row -->
  <g stroke-width="1.5">
    <rect x="30" y="230" width="140" height="58" rx="8" fill="#FFF2CC" stroke="#D6B656"/>
    <rect x="190" y="230" width="140" height="58" rx="8" fill="#E1D5E7" stroke="#9673A6"/>
    <rect x="350" y="230" width="140" height="58" rx="8" fill="#ffffff" stroke="#4b5563"/>
    <rect x="510" y="230" width="170" height="58" rx="8" fill="#E1D5E7" stroke="#9673A6"/>
    <rect x="700" y="230" width="150" height="58" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <rect x="870" y="230" width="140" height="58" rx="8" fill="#FFF2CC" stroke="#D6B656"/>
    <rect x="1030" y="230" width="140" height="58" rx="8" fill="#ffffff" stroke="#4b5563"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="100" y="254">Input guards</text><text x="260" y="254">Claim parser</text><text x="420" y="254">Period resolver</text>
    <text x="595" y="254">Agent loop</text><text x="775" y="254">Comparator</text><text x="940" y="254">Output guards</text><text x="1100" y="254">Response</text>
  </g>
  <g font-size="11" fill="#4b5563" text-anchor="middle">
    <text x="100" y="274">regex · Llama Guard</text><text x="260" y="274">model · 7 fields</text><text x="420" y="274">code · dates</text>
    <text x="595" y="274">model picks tools · ≤ 8 steps</text><text x="775" y="274">code decides the verdict</text><text x="940" y="274">safety · review triggers</text><text x="1100" y="274">verdict · figure · evidence</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)">
    <line x1="170" y1="259" x2="188" y2="259"/><line x1="330" y1="259" x2="348" y2="259"/><line x1="490" y1="259" x2="508" y2="259"/>
    <line x1="680" y1="259" x2="698" y2="259"/><line x1="850" y1="259" x2="868" y2="259"/><line x1="1010" y1="259" x2="1028" y2="259"/>
  </g>
  <text x="690" y="222" font-size="11" fill="#6b7280" text-anchor="middle">figure + provenance</text>

  <!-- row 2 -->
  <g stroke-width="1.5">
    <rect x="190" y="340" width="140" height="58" rx="8" fill="#F8CECC" stroke="#B85450"/>
    <rect x="870" y="340" width="140" height="58" rx="8" fill="#D5E8D4" stroke="#82B366"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#111827" text-anchor="middle"><text x="260" y="364">Declined</text><text x="940" y="364">Human review</text></g>
  <g font-size="11" fill="#4b5563" text-anchor="middle"><text x="260" y="384">stated reason returned</text><text x="940" y="384">graph paused</text></g>
  <path d="M260,288 V338" stroke="#B85450" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
  <text x="300" y="318" font-size="11" fill="#6b7280" text-anchor="middle">out of scope</text>
  <path d="M940,288 V338" stroke="#82B366" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
  <text x="975" y="318" font-size="11" fill="#6b7280" text-anchor="middle">triggered</text>
  <path d="M1010,369 H1100 V290" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="1130" y="340" font-size="11" fill="#6b7280" text-anchor="middle">resume</text>

  <!-- evidence -->
  <g stroke="#4b5563" stroke-width="1.5" fill="#f9fafb">
    <rect x="390" y="490" width="190" height="60" rx="8"/><rect x="600" y="490" width="190" height="60" rx="8"/>
    <rect x="810" y="490" width="170" height="60" rx="8"/><rect x="1000" y="490" width="160" height="60" rx="8"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="485" y="514">SEC EDGAR MCP</text><text x="695" y="514">Filing-text index</text><text x="895" y="514">Finnhub</text><text x="1080" y="514">Tavily</text>
  </g>
  <g font-size="11" fill="#4b5563" text-anchor="middle">
    <text x="485" y="534">XBRL facts · :9870</text><text x="695" y="534">pgvector + full text</text><text x="895" y="534">quotes</text><text x="1080" y="534">news</text>
  </g>
  <g stroke="#9673A6" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M550,288 V420 H485 V488"/><path d="M580,288 V430 H695 V488"/><path d="M610,288 V440 H895 V488"/><path d="M640,288 V410 H1080 V488"/>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="start">
    <text x="492" y="478">SEC agent · facts</text><text x="702" y="478">SEC agent · text</text><text x="902" y="478">market agent</text><text x="1087" y="478">news agent</text>
  </g>
  <path d="M1080,550 V575 H695 V552" stroke="#5F6B7A" stroke-width="1.5" stroke-dasharray="2 4" fill="none" marker-end="url(#a)"/>
  <text x="890" y="592" font-size="11" fill="#5F6B7A" text-anchor="middle">news → SEC delegation · one way · cannot recurse</text>

  <!-- storage -->
  <rect x="390" y="640" width="770" height="90" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <text x="775" y="664" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">PostgreSQL 16 + pgvector</text>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="520" y="700">audit_events · one row per step</text>
    <text x="775" y="700">audit_executions · envelope + checksum</text>
    <text x="1030" y="700">filing_chunks · memory store (optional)</text>
  </g>
  <path d="M100,288 V720 H388" stroke="#6C8EBF" stroke-width="1.5" stroke-dasharray="2 4" fill="none" marker-end="url(#a)"/>
  <text x="240" y="712" font-size="11" fill="#6C8EBF" text-anchor="middle">every tool call and verdict is written</text>
</svg>
